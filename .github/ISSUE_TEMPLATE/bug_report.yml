name: Bug report
description: Lỗi trong bản beta
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Phiên bản
      placeholder: "2026.09-beta.1"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Thiết bị / Android
  - type: textarea
    id: steps
    attributes:
      label: Các bước tái hiện
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Kết quả mong đợi / thực tế
    validations:
      required: true
