name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-content:
    name: Tài liệu, content, phiên bản
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Toàn vẹn docs/design (Controlled Change)
        run: python3 tools/verify_docs.py

      - name: Kiểm tra content + legacy guard
        run: python3 tools/validate_content.py

      - name: Kiểm tra phiên bản
        run: python3 tools/check_version.py

      - name: Unit test của tools
        run: python3 -m unittest discover -s tools/tests -t tools -v

  core:
    name: Core — unit test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Chạy test :core
        run: |
          chmod +x ./gradlew
          ./gradlew :core:test --stacktrace

      - name: Upload báo cáo test khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: core/build/reports/tests/
          retention-days: 7

  android:
    name: Android — lint + assembleDebug
    needs: [docs-content, core]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Đọc phiên bản
        run: python3 tools/check_version.py --github-env >> "$GITHUB_ENV"

      - name: Lint + build APK debug
        run: |
          chmod +x ./gradlew
          ./gradlew :app:lintDebug :app:assembleDebug --stacktrace

      - name: Đặt tên APK theo phiên bản
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/LastOutpost-${VERSION_NAME}-debug.apk"

      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: LastOutpost-${{ env.VERSION_NAME }}-debug-apk
          path: dist/*.apk
          retention-days: 14

      - name: Upload báo cáo lint khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: app/build/reports/
          retention-days: 7
