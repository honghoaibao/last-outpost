name: Release Beta

# Kích hoạt bằng tag v<VERSION_NAME>, ví dụ: git tag v2026.09-beta.1 && git push origin v2026.09-beta.1
# Hoặc chạy tay (workflow_dispatch) để chỉ build + lấy artifact, không tạo GitHub Release.
on:
  push:
    tags: ["v*-beta.*"]
  workflow_dispatch:

permissions:
  contents: write # cần để tạo GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build beta
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Ký release chỉ khi đã cấu hình secrets (xem docs/production/BUILD_AND_RELEASE.md).
      HAS_KEYSTORE: ${{ secrets.LO_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Kiểm tra phiên bản (và tag nếu có)
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            python3 tools/check_version.py --tag "${GITHUB_REF_NAME}"
          else
            python3 tools/check_version.py
          fi
          python3 tools/check_version.py --github-env >> "$GITHUB_ENV"

      - name: Kiểm tra docs + content (kênh beta)
        run: |
          python3 tools/verify_docs.py
          python3 tools/validate_content.py --channel beta
          python3 -m unittest discover -s tools/tests -t tools

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Giải mã keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          LO_KEYSTORE_BASE64: ${{ secrets.LO_KEYSTORE_BASE64 }}
        run: |
          echo "$LO_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "LO_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test core + build APK debug
        run: |
          chmod +x ./gradlew
          ./gradlew :core:test :app:assembleDebug --stacktrace

      - name: Build APK + AAB release (đã ký)
        if: env.HAS_KEYSTORE == 'true'
        env:
          LO_KEYSTORE_PASSWORD: ${{ secrets.LO_KEYSTORE_PASSWORD }}
          LO_KEY_ALIAS: ${{ secrets.LO_KEY_ALIAS }}
          LO_KEY_PASSWORD: ${{ secrets.LO_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Gom artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/LastOutpost-${VERSION_NAME}-debug.apk"
          if [ "${HAS_KEYSTORE}" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/LastOutpost-${VERSION_NAME}-release.apk"
            cp app/build/outputs/bundle/release/app-release.aab "dist/LastOutpost-${VERSION_NAME}-release.aab"
          fi
          (cd dist && sha256sum ./* > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LastOutpost-${{ env.VERSION_NAME }}
          path: dist/
          retention-days: 30

      - name: Tạo GitHub Release (prerelease)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --prerelease \
            --title "Last Outpost ${BUILD_LABEL}" \
            --notes-file "docs/releases/${VERSION_NAME}/RELEASE_NOTES.md"
