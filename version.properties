# Nguồn phiên bản duy nhất (single source of truth) — đọc bởi Gradle, CI và tools/.
# Quy ước chi tiết: docs/decisions/0002-version-scheme.md
#   VERSION_NAME = YYYY.MM-<kênh>.<N>            (vd: 2026.09-beta.1)
#   VERSION_CODE = YYYY*1_000_000 + MM*10_000 + N*100 + patch
#                  2026.09-beta.1 → 2_026_000_000 + 90_000 + 100 + 1 = 2026090101
#   Git tag      = v<VERSION_NAME>               (vd: v2026.09-beta.1)
BUILD_LABEL=2026.09 beta-1
VERSION_NAME=2026.09-beta.1
VERSION_CODE=2026090101
RELEASE_CHANNEL=beta
